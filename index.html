<!doctype html>
<html lang="pl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4E6A80">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BLOBBACK">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>BLOBBACK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800&family=Titan+One&display=swap">
<style>
:root {
  --red: #E3122B;
  --red-dark: #9D0718;
  --cream: #FFF3D6;
  --ink: #1D2230;
  --abyss: #4E6A80;
  --abyss-top: #9DB3C2;
  --display: 'Titan One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --ui: 'Rubik', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: var(--abyss);
  overscroll-behavior: none;
}

#app {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: linear-gradient(var(--abyss-top), var(--abyss) 45%, #253A4F 72%, #7A0A1C);
  font-family: var(--ui);
  color: var(--ink);
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}

#cv {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

/* Zawis: przygaszone brzegi */
#zawis {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  background: radial-gradient(ellipse at 50% 42%, rgba(30, 44, 66, 0) 38%, rgba(22, 30, 48, 0.62) 100%);
}

#flash {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: #fff;
  opacity: 0;
}

#labels {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.lbl {
  position: absolute;
  left: 0;
  top: 0;
  font-family: var(--display);
  font-size: 18px;
  white-space: nowrap;
  will-change: transform;
  -webkit-text-stroke: 1px var(--ink);
  text-shadow: 0 2px 0 var(--ink);
}
.lbl.scream { font-size: 20px; font-style: italic; letter-spacing: 1px; }
.lbl.plum { font-size: 22px; }
.lbl.chips { font-family: var(--ui); font-weight: 800; font-size: 15px; color: var(--cream) !important; }
.lbl.bang { font-size: 26px; color: var(--cream) !important; }
.lbl.bang.warn { font-size: 30px; color: var(--red) !important; -webkit-text-stroke: 2px var(--cream); }

/* pływający drążek */
#stick {
  position: absolute;
  left: 0;
  top: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.12s;
}
#stick.on { opacity: 1; }
#stick .ring, #stick .knob {
  position: absolute;
  left: 0;
  top: 0;
  border-radius: 50%;
  will-change: transform;
}
#stick .ring {
  width: 128px;
  height: 128px;
  margin: -64px 0 0 -64px;
  border: 2px solid rgba(255, 255, 255, 0.35);
  background: rgba(255, 255, 255, 0.06);
}
#stick .knob {
  width: 46px;
  height: 46px;
  margin: -23px 0 0 -23px;
  background: rgba(255, 255, 255, 0.3);
  box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.4);
}

/* HUD */
#hud {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  padding: calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 0 calc(12px + var(--safe-l));
  display: flex;
  align-items: flex-start;
  gap: 8px;
  pointer-events: none;
}
.pill {
  background: var(--cream);
  border: 3px solid var(--ink);
  border-radius: 14px;
  box-shadow: 0 4px 0 var(--ink);
  padding: 4px 10px;
  display: flex;
  align-items: baseline;
  gap: 6px;
  line-height: 1;
}
.pill small { font-size: 9px; font-weight: 800; letter-spacing: 1px; }
.pill b { font-family: var(--display); font-size: 22px; font-weight: 400; }
.pill.rung b { color: var(--red); }
.lives { display: inline-flex; gap: 2px; align-self: center; margin-left: 2px; }
.heart { width: 17px; height: 16px; display: block; overflow: visible; }
.heart path { fill: var(--red); stroke: var(--ink); stroke-width: 2.2; stroke-linejoin: round; transition: fill 0.2s; }
.heart.lost path { fill: transparent; stroke: rgba(29, 34, 48, 0.45); }
.heart.break { animation: heartbreak 0.5s ease-out; }
@keyframes heartbreak {
  0% { transform: scale(1); }
  20% { transform: scale(1.6) rotate(-12deg); }
  40% { transform: scale(1.3) rotate(10deg); }
  60% { transform: scale(0.8) rotate(-4deg); }
  100% { transform: scale(1) rotate(0); }
}
.heart.gain { animation: heartgain 0.4s ease-out; }
@keyframes heartgain { 0% { transform: scale(0.3); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
.pill.score i { font-style: normal; font-weight: 800; opacity: 0.55; }
.pill.score { font-variant-numeric: tabular-nums; }
.tools { margin-left: auto; display: flex; gap: 6px; pointer-events: auto; }
.tool {
  appearance: none;
  border: 3px solid var(--ink);
  background: var(--cream);
  color: var(--ink);
  border-radius: 12px;
  height: 36px;
  min-width: 36px;
  padding: 0 6px;
  box-shadow: 0 3px 0 var(--ink);
  font: 800 11px var(--ui);
  cursor: pointer;
  touch-action: manipulation;
}
.tool:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.tool svg { width: 20px; height: 20px; fill: var(--ink); stroke: var(--ink); stroke-width: 2; stroke-linecap: round; display: block; margin: auto; }
.tool .off { display: none; }
.tool.muted .on { display: none; }
.tool.muted .off { display: block; }
.tool.dbg { opacity: 0.55; }
.tool.dbg.active { opacity: 1; background: #DDEBF3; }

#combo {
  position: absolute;
  right: calc(14px + var(--safe-r));
  top: calc(64px + var(--safe-t));
  display: flex;
  flex-direction: column;
  align-items: center;
  pointer-events: none;
  opacity: 0;
  transform: scale(0.6);
  transition: opacity 0.2s, transform 0.2s;
  color: var(--cream);
}
#combo.on { opacity: 1; transform: scale(1); }
#combo b {
  font-family: var(--display);
  font-weight: 400;
  font-size: 38px;
  line-height: 1;
  color: var(--cream);
  -webkit-text-stroke: 2px var(--ink);
  text-shadow: 0 4px 0 var(--ink);
}
#combo small { font-weight: 800; font-size: 10px; letter-spacing: 2px; text-shadow: 0 1px 0 var(--ink); }
#combo.pop b { animation: pop 0.22s ease-out; }
@keyframes pop { 0% { transform: scale(1.5) rotate(-6deg); } 100% { transform: scale(1) rotate(0); } }

#bank {
  position: absolute;
  left: calc(14px + var(--safe-l));
  top: calc(62px + var(--safe-t));
  font: 800 11px var(--ui);
  color: var(--cream);
  letter-spacing: 1px;
  text-shadow: 0 1px 0 var(--ink);
  pointer-events: none;
}

#debug {
  position: absolute;
  left: calc(10px + var(--safe-l));
  bottom: calc(10px + var(--safe-b));
  background: rgba(20, 26, 38, 0.78);
  color: #DDEBF3;
  border-radius: 10px;
  padding: 8px 10px;
  pointer-events: auto;
}
#debug[hidden] { display: none; }
#debug pre { margin: 0 0 6px; font: 11px/1.35 ui-monospace, Menlo, monospace; }
#debug .tool { height: 28px; font-size: 10px; margin-right: 4px; }

/* plansze i odliczanie */
#banner, #countdown {
  position: absolute;
  left: 0;
  right: 0;
  text-align: center;
  pointer-events: none;
  font-family: var(--display);
  color: var(--cream);
  -webkit-text-stroke: 3px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 6px 0 var(--ink);
  opacity: 0;
}
#banner { top: 34%; font-size: clamp(34px, 10vw, 64px); }
#banner.on { animation: banner 1.3s ease-out forwards; }
#banner.red { color: var(--red); }
@keyframes banner {
  0% { opacity: 0; transform: translateY(20px) scale(0.7); }
  15% { opacity: 1; transform: translateY(0) scale(1.08); }
  25% { transform: scale(1); }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-10px); }
}
#countdown { top: 30%; font-size: clamp(90px, 30vw, 170px); }
#countdown.on { animation: count 0.6s ease-out forwards; }
@keyframes count {
  0% { opacity: 0; transform: scale(2.2); }
  30% { opacity: 1; transform: scale(0.9); }
  45% { transform: scale(1); }
  100% { opacity: 0.9; transform: scale(1); }
}

/* ekrany */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: calc(20px + var(--safe-t)) calc(16px + var(--safe-r)) calc(20px + var(--safe-b)) calc(16px + var(--safe-l));
  box-sizing: border-box;
}
.screen[hidden] { display: none; }

#start {
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 30%, rgba(255, 243, 214, 0.25), rgba(20, 30, 48, 0.35) 70%);
  justify-content: flex-start;
  transition: opacity 0.35s;
}
#start.out { opacity: 0; }
.logo {
  margin: 12vh 0 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(46px, 15vw, 104px);
  letter-spacing: -1px;
  line-height: 1;
  display: flex;
  filter: drop-shadow(0 6px 0 var(--ink)) drop-shadow(0 16px 18px rgba(0, 0, 0, 0.35));
}
.logo span {
  display: inline-block;
  background: linear-gradient(175deg, #FF8A97 0%, var(--red) 38%, #B40A1E 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-stroke: 2px var(--ink);
  animation: wobble 2.4s ease-in-out infinite;
}
.logo span:nth-child(2n) { animation-delay: -0.3s; }
.logo span:nth-child(3n) { animation-delay: -0.8s; }
@keyframes wobble {
  0%, 100% { transform: translateY(0) scale(1, 1); }
  40% { transform: translateY(-5px) scale(0.96, 1.05); }
  60% { transform: translateY(2px) scale(1.05, 0.95); }
}
/* onboarding v0.8: kciuk stuka ZA blobem, kropla leci w punkt, strzałka pokazuje odlot w drugą stronę.
   Pozycje ustawia JS (ui.ghost) z rzutu gracza na ekran; cykl 1,6 s jak animacja kciuka. */
.ghost-thumb, .ghost-arrow, .ghost-shot {
  position: absolute;
  left: 0;
  top: 0;
  width: 0;
  height: 0;
  will-change: transform;
}
.ghost-arrow { height: 0; transform-origin: 0 0; }
.ghost-arrow i {
  position: absolute;
  left: 0;
  top: -4px;
  width: 100%;
  height: 8px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.85);
  transform-origin: 0 50%;
  animation: arrowgo 1.6s ease-out infinite;
}
.ghost-arrow i::after {
  content: '';
  position: absolute;
  right: -14px;
  top: -8px;
  border-left: 18px solid rgba(255, 255, 255, 0.85);
  border-top: 12px solid transparent;
  border-bottom: 12px solid transparent;
}
@keyframes arrowgo {
  0%, 38% { opacity: 0; transform: scaleX(0.15); }
  48% { opacity: 1; }
  80% { opacity: 1; transform: scaleX(1); }
  100% { opacity: 0; transform: scaleX(1); }
}
.ghost-shot::before {
  content: '';
  position: absolute;
  left: -7px;
  top: -7px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--red);
  box-shadow: 0 0 0 2px var(--ink);
  animation: shotgo 1.6s ease-in infinite;
}
@keyframes shotgo {
  0%, 36% { opacity: 0; transform: translate(0, 0); }
  40% { opacity: 1; transform: translate(0, 0); }
  60% { opacity: 1; transform: translate(var(--dx, 0), var(--dy, 0)); }
  66%, 100% { opacity: 0; transform: translate(var(--dx, 0), var(--dy, 0)); }
}
.ghost-thumb .thumb {
  position: absolute;
  width: 70px;
  height: 96px;
  left: -35px;
  top: -12px;
  border-radius: 35px 35px 30px 30px;
  background: rgba(255, 255, 255, 0.22);
  border: 2px solid rgba(255, 255, 255, 0.55);
  animation: press 1.6s ease-in-out infinite;
}
.ghost-thumb .nail {
  position: absolute;
  left: 17px;
  top: 8px;
  width: 36px;
  height: 30px;
  border-radius: 16px 16px 12px 12px;
  border: 2px solid rgba(255, 255, 255, 0.45);
}
.ghost-thumb .ripple {
  position: absolute;
  width: 90px;
  height: 90px;
  left: -45px;
  top: -45px;
  border-radius: 50%;
  border: 3px solid rgba(255, 255, 255, 0.6);
  opacity: 0;
  animation: ripple 1.6s ease-out infinite;
}
.ghost-thumb .ripple.r2 { animation-delay: 0.25s; }
@keyframes press {
  0%, 100% { transform: translateY(-14px) scale(1); opacity: 0.7; }
  35%, 70% { transform: translateY(0) scale(0.94); opacity: 1; }
}
@keyframes ripple {
  0%, 30% { opacity: 0; transform: scale(0.3); }
  40% { opacity: 1; }
  100% { opacity: 0; transform: scale(1.6); }
}

/* podest */
#podest { background: rgba(18, 26, 42, 0.72); gap: 22px; }
.podest-head { text-align: center; color: var(--cream); }
.podest-title {
  font-family: var(--display);
  font-size: clamp(34px, 10vw, 56px);
  -webkit-text-stroke: 2px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 5px 0 var(--ink);
}
.tally {
  margin-top: 8px;
  display: inline-flex;
  gap: 8px;
  align-items: baseline;
  background: var(--cream);
  color: var(--ink);
  border: 3px solid var(--ink);
  border-radius: 14px;
  box-shadow: 0 4px 0 var(--ink);
  padding: 6px 14px;
  font: 800 20px var(--ui);
  font-variant-numeric: tabular-nums;
}
.tally i { font-style: normal; opacity: 0.5; }
.tally b { color: var(--red); font-family: var(--display); font-weight: 400; font-size: 26px; }
.cards {
  display: flex;
  gap: 10px;
  width: 100%;
  max-width: 460px;
  justify-content: center;
}
.card {
  appearance: none;
  flex: 1 1 0;
  min-width: 0;
  max-width: 150px;
  background: var(--cream);
  border: 3px solid var(--ink);
  border-radius: 18px;
  box-shadow: 0 6px 0 var(--ink);
  padding: 14px 8px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  font: 800 13px/1.15 var(--ui);
  color: var(--ink);
  text-transform: uppercase;
  text-align: center;
  cursor: pointer;
  touch-action: manipulation;
  opacity: 0;
  transform: translateY(30px) rotate(-3deg);
  animation: deal 0.35s ease-out forwards;
}
.card:nth-child(2) { animation-delay: 0.08s; transform: translateY(30px) rotate(2deg); }
.card:nth-child(3) { animation-delay: 0.16s; transform: translateY(30px) rotate(-1deg); }
@keyframes deal { to { opacity: 1; transform: translateY(0) rotate(0); } }
.card .pic {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  border: 3px solid var(--ink);
}
.card .pic img { width: 40px; height: 40px; display: block; }
.card:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.cards.locked .card { pointer-events: none; }

/* śmierć */
#dead { background: rgba(18, 26, 42, 0.62); gap: 14px; }
.stamp {
  font: 800 clamp(26px, 8vw, 42px) var(--ui);
  color: var(--red);
  border: 5px solid var(--red);
  border-radius: 10px;
  padding: 4px 14px;
  letter-spacing: 2px;
  transform: rotate(-8deg);
  background: rgba(255, 243, 214, 0.92);
  animation: stamp 0.3s cubic-bezier(0.3, 1.6, 0.5, 1) both;
}
@keyframes stamp { from { transform: rotate(-8deg) scale(2.4); opacity: 0; } }
.dead-rung { font-family: var(--display); color: var(--cream); font-size: 26px; -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; margin-top: 10px; }
.dead-stats { color: var(--cream); font: 600 14px var(--ui); opacity: 0.9; text-align: center; }
.dubel {
  margin-top: 24px;
  appearance: none;
  font-family: var(--display);
  font-size: clamp(38px, 12vw, 60px);
  color: var(--cream);
  background: var(--red);
  border: 4px solid var(--ink);
  border-radius: 24px;
  box-shadow: 0 8px 0 var(--ink), inset 0 -8px 0 rgba(0, 0, 0, 0.18), inset 0 6px 0 rgba(255, 255, 255, 0.25);
  padding: 10px 36px 14px;
  -webkit-text-stroke: 2px var(--ink);
  paint-order: stroke fill;
  cursor: pointer;
  touch-action: manipulation;
  animation: breathe 1.4s ease-in-out infinite;
}
.dubel:active { animation: none; transform: translateY(6px); box-shadow: 0 2px 0 var(--ink); }
.dubel.locked { pointer-events: none; opacity: 0.6; }
@keyframes breathe { 50% { transform: scale(1.04); } }

@media (prefers-reduced-motion: reduce) {
  .logo span, .ghost-thumb .thumb, .ghost-thumb .ripple, .dubel, .ghost-arrow i, .ghost-shot::before { animation: none; }
}
</style>
<script type="importmap">{"imports":{"three":"./three.module.min.js"}}</script>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="zawis"></div>
  <div id="flash"></div>
  <div id="labels"></div>
  <div id="stick"><div class="ring"></div><div class="knob"></div></div>

  <div id="hud">
    <div class="pill rung"><small>SZCZEBEL</small><b id="hud-rung">1</b><span class="lives" id="hud-lives"><svg class="heart" viewBox="0 0 24 22"><path d="M12 21C5 15.5 1.5 12 1.5 7.2A5.4 5.4 0 0 1 12 4.6a5.4 5.4 0 0 1 10.5 2.6C22.5 12 19 15.5 12 21z"/></svg><svg class="heart" viewBox="0 0 24 22"><path d="M12 21C5 15.5 1.5 12 1.5 7.2A5.4 5.4 0 0 1 12 4.6a5.4 5.4 0 0 1 10.5 2.6C22.5 12 19 15.5 12 21z"/></svg><svg class="heart" viewBox="0 0 24 22"><path d="M12 21C5 15.5 1.5 12 1.5 7.2A5.4 5.4 0 0 1 12 4.6a5.4 5.4 0 0 1 10.5 2.6C22.5 12 19 15.5 12 21z"/></svg></span></div>
    <div class="pill score"><b id="hud-chips">0</b><i>×</i><b id="hud-mult">1.0</b></div>
    <div class="tools">
      <button id="btn-mute" class="tool" aria-label="Dźwięk">
        <svg class="on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none"/></svg>
        <svg class="off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l6 6M22 9l-6 6" fill="none"/></svg>
      </button>
      <button id="btn-debug" class="tool dbg" aria-label="Debug">dbg</button>
    </div>
  </div>
  <div id="combo"><b id="combo-n">2</b><small>COMBO</small></div>
  <div id="bank"></div>
  <div id="debug" hidden>
    <pre id="debug-text"></pre>
    <button id="btn-cam" class="tool">kamera A/B/C</button>
    <button id="btn-ctrl" class="tool">sterowanie: wskaż</button>
  </div>

  <div id="banner"></div>
  <div id="countdown"></div>

  <div id="start" class="screen">
    <h1 class="logo" aria-label="BLOBBACK"><span>B</span><span>L</span><span>O</span><span>B</span><span>B</span><span>A</span><span>C</span><span>K</span></h1>
    <div class="ghost-shot" aria-hidden="true"></div>
    <div class="ghost-arrow" aria-hidden="true"><i></i></div>
    <div class="ghost-thumb" aria-hidden="true">
      <div class="ripple"></div>
      <div class="ripple r2"></div>
      <div class="thumb"><div class="nail"></div></div>
    </div>
  </div>

  <div id="podest" class="screen" hidden>
    <div class="podest-head">
      <div class="podest-title">PODEST</div>
      <div class="tally"><span id="pd-chips">0</span><i>×</i><span id="pd-mult">1.0</span><i>=</i><b id="pd-total">0</b></div>
    </div>
    <div class="cards" id="pd-cards"></div>
  </div>

  <div id="dead" class="screen" hidden>
    <div class="stamp">NIEZALICZONY</div>
    <div class="dead-rung" id="dead-rung">SZCZEBEL 1</div>
    <div class="dead-stats" id="dead-stats"></div>
    <button id="btn-dubel" class="dubel">DUBEL</button>
